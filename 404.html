<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Sabir Lalahiane</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#FAFAFA;color:#0F172A;line-height:1.6;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{text-align:center;max-width:520px;padding:48px 24px}
    h1{font-size:clamp(3rem,10vw,5rem);font-weight:800;background:linear-gradient(135deg,#2563EB,#38BDF8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.03em}
    h2{font-size:1.5rem;font-weight:700;margin:8px 0 12px}
    p{color:#64748B;margin-bottom:28px}
    a{display:inline-block;padding:14px 32px;border-radius:12px;background:#2563EB;color:#fff;text-decoration:none;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,0.3);transition:all .3s}
    a:hover{background:#1D4ED8;transform:translateY(-2px)}
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Looks like you hit a broken link or moved page. Let's get you back to the good stuff.</p>
    <a href="./">Back to Home</a>
  </div>
</body>
</html>
